[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-table-filter"
version = "0.1.0"
description = "Checkbox table filters for Streamlit apps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=1.5.3", "streamlit>=1.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_table_filter"]
