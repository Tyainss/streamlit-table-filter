[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "streamlit-table-filter"
version = "0.1.0"
description = "A table-based multi-select filter for Streamlit apps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["streamlit", "dashboard", "filter", "multiselect", "checkbox", "table"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = ["pandas>=1.5.3", "streamlit>=1.40"]

[project.optional-dependencies]
polars = ["polars"]

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_table_filter"]

[dependency-groups]
dev = [
    # pytest 9.2.0 crashes at startup on Python 3.10.0.
    "pytest>=9.1,!=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff.format]
exclude = ["*.md"]
