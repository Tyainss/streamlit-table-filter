name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            streamlit: "streamlit==1.40.0"
          - python-version: "3.10"
            streamlit: "streamlit"
          - python-version: "3.14"
            streamlit: "streamlit"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install "pip>=25.1"
          python -m pip install --group dev . "${{ matrix.streamlit }}"
      - name: Test the base installation
        run: python -m pytest tests
      - name: Test with Polars installed
        run: |
          python -m pip install ".[polars]" "${{ matrix.streamlit }}"
          python -c "import polars"
          python -m pytest tests

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install check tools
        run: |
          python -m pip install "pip>=25.1"
          python -m pip install --group dev build twine
      - name: Check lint and formatting
        run: |
          ruff check
          ruff format --check
      - name: Check package distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
